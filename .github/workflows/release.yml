name: release

on:
  push:
    tags:
      - v[0-9]+.*

permissions:
  contents: write
  checks: read

defaults:
  run:
    shell: python3 tools/ci-job.py run {0}

jobs:
  guard:
    runs-on:
      group: nishisan
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/isolated-job
      - name: require main ancestry and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          gh api "repos/$GITHUB_REPOSITORY/commits/$(git rev-parse HEAD)/check-runs" --paginate \
            --jq '.check_runs[] | select(.name == "required" and .app.slug == "github-actions" and .conclusion == "success") | .id' > "$RUNNER_TEMP/required-checks"
          test -s "$RUNNER_TEMP/required-checks"

  goreleaser:
    needs: guard
    runs-on:
      group: nishisan
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/isolated-job
      - name: Run GoReleaser
        run: bash tools/ci-tool.sh goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
