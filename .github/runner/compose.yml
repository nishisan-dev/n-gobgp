services:
  runner:
    build: .
    image: n-gobgp-ci-runner:2.338.2
    container_name: n-gobgp-ci-runner
    hostname: n-gobgp-ci-runner
    privileged: true
    restart: unless-stopped
    init: true
    cpus: 3
    mem_limit: 8g
    pids_limit: 4096
    environment:
      RUNNER_NAME: n-gobgp-vm192-1
    volumes:
      - docker-data:/var/lib/docker
      - /var/tmp/ngobgp-ci-runner/private/registration-token:/run/secrets/runner-registration-token:ro
    networks: [runner]
volumes:
  docker-data:
networks:
  runner:
    ipam:
      config:
        - subnet: 10.231.90.0/24
