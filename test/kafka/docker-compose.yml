# Disposable integration brokers. No production settings or persistent volumes.
x-kafka-environment: &kafka-environment
  KAFKA_NODE_ID: 1
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
services:
  primary:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:9092"]
    environment:
      <<: *kafka-environment
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
  analytics:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19094:9092"]
    environment:
      <<: *kafka-environment
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19094
